name: Deploy Mini Projects

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Todo App
        working-directory: todo-app
        run: |
          npm ci
          npm run build

      - name: Build Login Page
        working-directory: login-page
        run: |
          npm ci
          npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/todo-app deploy/login-page
          cp -r todo-app/dist/* deploy/todo-app/
          cp -r login-page/dist/* deploy/login-page/

      - name: Create root index
        run: |
          cat > deploy/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8" />
              <title>React Mini Projects</title>
            </head>
            <body>
              <h1>React Mini Projects</h1>
              <ul>
                <li><a href="./todo-app/">Todo App</a></li>
                <li><a href="./login-page/">Login Page</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4